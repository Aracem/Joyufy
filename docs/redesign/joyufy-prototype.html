<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joyufy redesign prototype</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,sans-serif;color:#e9edf4;background:#101216}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8bb6ff;outline-offset:2px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:680px}.side{background:#15181d;border-right:1px solid #292e37;padding:26px 14px;display:flex;flex-direction:column;gap:4px}.brand{font-size:22px;font-weight:700;letter-spacing:-1px;margin:0 10px 30px}.brand:before{content:'';display:inline-block;background:#80aefb;width:10px;height:10px;border-radius:50%;margin-right:8px}.side button{background:none;border:0;color:#9da7b5;padding:11px;text-align:left;border-radius:9px}.side button.active{background:#282e38;color:#f7f9fc}.side button:hover{background:#252a32}.side .caption{color:#727e8f;font-size:10px;letter-spacing:.12em;margin:24px 10px 8px}.side .spacer{flex:1}.content{padding:38px clamp(24px,5vw,76px);width:100%;max-width:1400px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;gap:12px}.title{font-weight:650;font-size:21px;letter-spacing:-.5px}.muted{color:#929eae}.small{font-size:12px}.eyebrow{font-size:12px;color:#9da8b8;margin:0 0 10px}.amount{font-size:clamp(34px,5vw,52px);font-weight:600;letter-spacing:-2px;line-height:1.1}.positive{color:#62d8a2}.negative{color:#fb8290}.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:20px}.gap8{gap:8px}.btn{border:1px solid #3b4452;background:#252b34;color:#ecf1f8;padding:10px 14px;border-radius:9px}.btn.primary{background:#80aefb;color:#0e1723;border-color:#80aefb;font-weight:650}.btn.ghost{background:transparent}.btn:hover{background:#343d4a}.btn.primary:hover{background:#a2c4ff}.btn:disabled{color:#677384;background:#20252c;cursor:default}.section{font-size:16px;font-weight:650;letter-spacing:-.2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid #303742;background:#191d23;border-radius:15px;padding:20px;min-width:0}.card h3{font-size:14px;margin:0 0 15px}.metric{font-size:24px;letter-spacing:-.7px;margin:9px 0}.line{height:1px;background:#303742;margin:18px 0}.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{border:0;background:transparent;color:#9aa6b5;padding:8px 11px;border-radius:8px}.pill.active{background:#2c3440;color:#f6f8fc}.tag{display:inline-block;border-radius:6px;padding:4px 7px;background:#293441;color:#a9caff;font-size:11px}.alert{background:#25281e;border:1px solid #4a5036;color:#dfe4c4;border-radius:12px;padding:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}.chart{height:220px;width:100%;display:block}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#8895a6;font-size:11px;font-weight:500;padding:12px 8px;border-bottom:1px solid #343b46}.table td{padding:14px 8px;border-bottom:1px solid #2a303a}.table tr:last-child td{border-bottom:0}.right{text-align:right!important}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dot,#80aefb);margin-right:8px}.bar{height:8px;border-radius:8px;background:#80aefb;display:flex;overflow:hidden}.bar:before{content:"";width:30%;background:#80aefb}.bar:after{content:"";width:62%;background:#bea5ec}.bar i{flex:1;background:#e4bc87}.fields{display:grid;gap:14px}.fields label{display:grid;gap:7px;color:#aab4c1;font-size:12px}.fields input,.fields select{background:#11151a;border:1px solid #3b4452;border-radius:8px;padding:12px;color:#f4f6f9;width:100%}.modal-wrap{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px}.modal{background:#1c2128;border:1px solid #3b4452;border-radius:16px;padding:24px;width:min(560px,100%);max-height:640px;overflow:auto;box-shadow:0 24px 80px #0009}.modal h2{margin:0 0 7px;font-size:20px}.modal .footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.hide{display:none!important}.notice{font-size:11px;color:#7c899a;margin-top:28px}.category-bars{display:grid;gap:14px}.category-line{display:grid;grid-template-columns:minmax(90px,1fr) minmax(80px,2fr) 100px;gap:14px;align-items:center}.category-track{height:8px;background:#303742;border-radius:4px;overflow:hidden}.category-fill{height:100%;background:#80aefb;border-radius:4px}.segmented{display:flex;gap:4px;background:#11151a;border:1px solid #3b4452;border-radius:9px;padding:4px}.segmented button{flex:1;border:0;border-radius:6px;background:#11151a;color:#9da7b5;padding:10px}.segmented button[aria-pressed="true"]{background:#33445e;color:#f7f9fc}.month-nav{display:flex;align-items:center;gap:8px}.month-nav strong{min-width:120px;text-align:center}.select-input{position:relative}.select-input select{appearance:auto}.fields input[type="date"]{color-scheme:dark}@media(max-width:800px){.shell{grid-template-columns:64px 1fr}.side{padding:20px 7px}.brand{font-size:0;margin:0 10px 25px}.side button{font-size:0}.side button:first-letter{font-size:18px}.side .caption{font-size:0}.content{padding:28px 22px}.three{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.table{min-width:570px}.scroll{overflow:auto}}@media(max-width:460px){.shell{display:block}.side{flex-direction:row;overflow:auto;position:sticky;top:0;z-index:2}.side .brand,.side .caption,.side .spacer,.side .account-nav{display:none}.side button{font-size:12px;white-space:nowrap}.side button:first-letter{font-size:12px}.top{margin-bottom:24px}.content{padding:22px 16px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">joyufy</div><button data-view="overview">◈ &nbsp; Overview</button><button data-view="transactions">≡ &nbsp; Transactions</button><button data-view="rules">◇ &nbsp; Rules</button><div class="caption">ACCOUNTS</div><button class="account-nav" data-view="bank">● &nbsp; Everyday account</button><button class="account-nav" data-view="investment">● &nbsp; Investments</button><button class="account-nav" data-view="cash">● &nbsp; Cash</button><button data-dialog="account">＋ &nbsp; Add account</button><div class="spacer"></div><button data-view="settings">⚙ &nbsp; Settings</button></aside><main class="content"><div id="screen"></div><div class="notice">Interactive design prototype · Example data · Changes are not saved</div></main></div><div id="overlay" class="modal-wrap hide" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div><script>
const $=s=>document.querySelector(s); let view='overview',tab='General',range='1Y',mode='Area',monthIndex=2,transactionType='Expense';
const button=(label,action,kind='')=>`<button class="btn ${kind}" ${action}>${label}</button>`;
const chart=()=>`<svg class="chart" viewBox="0 0 800 220" preserveAspectRatio="none" role="img" aria-label="Example net worth chart">${mode==='Area'?'<path d="M0 175 L60 166 110 170 170 145 230 150 285 119 345 129 400 102 460 113 520 82 580 87 630 58 690 67 745 36 800 22 L800 220 H0Z" fill="#26354a"/><path d="M0 175 L60 166 110 170 170 145 230 150 285 119 345 129 400 102 460 113 520 82 580 87 630 58 690 67 745 36 800 22" fill="none" stroke="#80aefb" stroke-width="3" vector-effect="non-scaling-stroke"/>':Array.from({length:20},(_,i)=>`<rect x="${i*40+4}" y="${170-i*6+(i%3)*12}" width="21" height="${40+i*6-(i%3)*12}" rx="3" fill="#80aefb"/>`).join('')}</svg>`;
const chartControls=()=>`<div class="row between wrap"><div class="pills">${['1W','1M','3M','6M','YTD','1Y','All'].map(x=>`<button class="pill ${x===range?'active':''}" data-range="${x}">${x}</button>`).join('')}</div><div class="pills">${['Area','Bars'].map(x=>`<button class="pill ${x===mode?'active':''}" data-mode="${x}">${x}</button>`).join('')}</div></div>`;
const header=(name,action='')=>`<div class="top"><div class="title">${name}</div>${action}</div>`;
const rows=()=>`<div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Transaction</th><th>Category</th><th>Account</th><th class="right">Amount</th></tr></thead><tbody><tr><td>11 Nov</td><td>Mercadona</td><td>Groceries</td><td>Everyday</td><td class="right">− € 72.40</td></tr><tr><td>08 Nov</td><td>Salary</td><td>Income</td><td>Everyday</td><td class="right positive">+ € 4,200.00</td></tr><tr><td>06 Nov</td><td>Monthly investment</td><td>Transfer</td><td>Everyday → Investments</td><td class="right">− € 500.00</td></tr><tr><td>02 Nov</td><td>Rent</td><td>Home</td><td>Everyday</td><td class="right">− € 980.00</td></tr></tbody></table></div>`;
const overview=()=>`${header('Overview',button('+ Add transaction','data-dialog="transaction"','primary'))}<div class="stack"><div><div class="eyebrow">Total net worth</div><div class="amount">€ 84,620.48</div><p class="positive">↗ € 6,420.15 &nbsp; (+8.21%) <span class="muted small">past year</span></p>${chart()}${chartControls()}<div class="line"></div><div class="row wrap small muted"><span>Show:</span><span class="tag">All accounts</span><span>Liquid</span><span>Investments</span><span> · </span><span class="dot"></span>Total<span class="dot" style="--dot:#bea5ec"></span>Investments</div></div><div class="alert"><span>◷ &nbsp; <b>Investment update due</b> <span class="muted"> · Last updated 2 weeks ago</span></span>${button('Update value','data-dialog="snapshot"')}</div><div class="row between"><span class="section">Your money, at a glance</span><button class="pill" data-view="transactions">View transactions →</button></div><div class="grid"><div class="card"><span class="muted small">This month · Net cash flow</span><div class="metric">+ € 1,840.00</div><span class="positive small">Income € 4,200</span> <span class="muted small"> · Expenses € 2,360</span><div class="line"></div><span class="muted small">€ 240 more saved than last month</span><div style="margin-top:14px"><button class="pill" data-view="month">Explore this month →</button></div></div><div class="card"><span class="muted small">Net worth by account</span><div class="metric">3 accounts</div><div class="bar"><i></i></div><p class="muted small">Bank 30% &nbsp; · &nbsp; Investment 62% &nbsp; · &nbsp; Cash 8%</p></div></div><div class="row between"><span class="section">Recent activity</span><button class="pill" data-view="transactions">See all →</button></div>${rows()}</div>`;
const account=(type)=>{let inv=type==='investment',cash=type==='cash',name=inv?'Investments':cash?'Cash':'Everyday account',amount=inv?'€ 52,350.20':cash?'€ 6,850.00':'€ 25,420.28';return `${header('‹ &nbsp; '+name,`<div class="row">${button('Edit','data-dialog="account"')}${inv?button('+ Add transaction','data-dialog="transaction"'):''}${button(inv?'Update value':'+ Add transaction',inv?'data-dialog="snapshot"':'data-dialog="transaction"','primary')}</div>`)}<div class="stack"><div><div class="eyebrow">${inv?'Investment value':'Current balance'}</div><div class="amount">${amount}</div><p class="positive small">+ € 1,240.15 &nbsp; (+2.43%) <span class="muted">past year</span></p>${chart()}${chartControls()}</div>${inv?`<div class="grid three"><div class="card"><span class="muted small">Contribution-adjusted gain</span><div class="metric positive">+ € 2,450.20</div></div><div class="card"><span class="muted small">Market performance</span><div class="metric">+ € 2,380.20</div></div><div class="card"><span class="muted small">Time-weighted return</span><div class="metric">+ 5.4%</div></div></div>`:''}<div class="row between wrap"><span class="section">${inv?'Snapshots & activity':'Activity'}</span><div class="row">${button('Filters','data-dialog="filters"')}${button('Import statement','data-dialog="import"')}</div></div>${inv?`<div class="card"><div class="row between"><span>4 Nov 2026 <span class="muted"> · Weekly snapshot</span></span><b>€ 52,350.20</b></div><p class="muted small">Deposits € 500 · Fees € 0 · Dividends € 0</p>${button('Edit','data-dialog="snapshot"') }</div>`:rows()}</div>`};
const transactions=()=>`${header('Transactions',button('+ Add transaction','data-dialog="transaction"','primary'))}<div class="stack"><div class="grid three"><div class="card"><span class="muted small">Needs review</span><div class="metric">8</div><span class="small">Imported drafts</span></div><div class="card"><span class="muted small">Uncategorized</span><div class="metric">3</div><span class="small">Add a category</span></div><div class="card"><span class="muted small">Possible duplicates</span><div class="metric">2</div><span class="small">Review transactions</span></div></div><div class="row wrap">${button('All accounts ▾','data-dialog="filters"')}${button('All types ▾','data-dialog="filters"')}${button('Date ▾','data-dialog="filters"')}${button('More filters','data-dialog="filters"')}<input aria-label="Search transactions" placeholder="Search transactions" style="background:#191d23;color:white;border:1px solid #3b4452;border-radius:8px;padding:11px"></div><div class="pills"><button class="pill active">All</button><button class="pill">Needs review</button><button class="pill">Uncategorized</button><button class="pill">Duplicates</button></div>${rows()}<div class="row">${button('Select transactions','data-dialog="bulk"')}${button('Import statement','data-dialog="import"')}${button('Data quality','data-dialog="quality"')}</div></div>`;
const rules=()=>`${header('Categorization rules',button('+ New rule','data-dialog="rule"','primary'))}<div class="stack"><p class="muted">Apply categories consistently when you enter or import transactions. Rules run in the order shown.</p><div class="card"><div class="row between"><span><b>☰ &nbsp; Mercadona → Groceries</b><br><span class="muted small">Description contains “mercadona” · Any account</span></span><span class="tag">Enabled</span></div></div><div class="card"><div class="row between"><span><b>☰ &nbsp; Salary → Income</b><br><span class="muted small">Description contains “nomina” · Everyday account</span></span><span class="tag">Enabled</span></div></div>${button('Preview rules','data-dialog="rule"')}</div>`;
const settings=()=>`${header('Settings')}<div class="pills">${['General','Accounts','Data','Cloud','About'].map(x=>`<button class="pill ${tab===x?'active':''}" data-tab="${x}">${x}</button>`).join('')}</div><div class="line"></div><div class="stack">${({General:`<div class="card"><h3>Appearance</h3><div class="row between"><span>Theme <span class="muted small"> · Dark, light, or system</span></span>${button('Dark ▾','data-dialog="appearance"')}</div><div class="line"></div><div class="row between"><span>Language</span>${button('English ▾','data-dialog="appearance"')}</div></div>`,Accounts:`<div class="card"><h3>Your accounts</h3><p>Everyday account &nbsp; · &nbsp; Investments &nbsp; · &nbsp; Cash</p>${button('Manage accounts','data-dialog="account"')}</div>`,Data:`<div class="card"><h3>Backup and import</h3><p class="muted">Keep a copy of your financial data or restore an existing backup.</p><div class="row wrap">${button('Export backup','data-dialog="backup"')}${button('Import backup','data-dialog="backup"')}${button('Import statement','data-dialog="import"')}</div></div><div class="card"><h3>Investment flows</h3><p class="muted">Preview and backfill investment deposits and withdrawals.</p>${button('Preview backfill','data-dialog="backfill"')}</div><div class="card"><h3>Danger zone</h3><p class="muted">Permanently remove local data.</p>${button('Delete all data','data-dialog="delete"')}</div>`,Cloud:`<div class="card"><h3>Google Drive</h3><p><span class="tag">Connected</span> <span class="muted">Last synced today at 09:42</span></p><div class="row wrap">${button('Sync now','data-dialog="cloud"')}${button('Restore from cloud','data-dialog="backup"')}${button('Disconnect','data-dialog="cloud"')}</div></div>`,About:`<div class="card"><h3>Joyufy</h3><p class="muted">Version 1.4 · Your finances, in perspective.</p>${button('Check for updates','data-dialog="about"')}</div>`})[tab]}</div>`;
const monthlySamples=[
 {name:'September 2026',income:4200,expenses:2500,net:1700,categories:[['Home',980],['Groceries',520],['Transport',400],['Leisure',350],['Other',250]]},
 {name:'October 2026',income:4200,expenses:2600,net:1600,categories:[['Home',980],['Groceries',560],['Transport',380],['Leisure',420],['Other',260]]},
 {name:'November 2026',income:4200,expenses:2360,net:1840,categories:[['Home',980],['Groceries',480],['Transport',320],['Leisure',360],['Other',220]]}
];
const money=n=>'€ '+Math.abs(n).toLocaleString('en-IE',{minimumFractionDigits:2,maximumFractionDigits:2});
const month=()=>{const m=monthlySamples[monthIndex],previous=monthlySamples[monthIndex-1];const comparison=(value,before)=>before==null?'No earlier example':`${value>=before?'+':'−'} ${money(value-before)} vs previous month`;return `${header('‹ &nbsp; Monthly analysis',button('Back to overview','data-view="overview"'))}<div class="stack"><div class="row between wrap"><div><div class="eyebrow">Month</div><div class="section">${m.name}</div></div><div class="month-nav"><button class="btn" data-month="-1" aria-label="Previous month" ${monthIndex===0?'disabled':''}>←</button><strong>${m.name}</strong><button class="btn" data-month="1" aria-label="Next month" ${monthIndex===monthlySamples.length-1?'disabled':''}>→</button></div></div><div class="grid three"><div class="card"><span class="muted small">Income</span><div class="metric">${money(m.income)}</div><span class="muted small">${comparison(m.income,previous?.income)}</span></div><div class="card"><span class="muted small">Expenses</span><div class="metric">${money(m.expenses)}</div><span class="muted small">${comparison(m.expenses,previous?.expenses)}</span></div><div class="card"><span class="muted small">Net cash flow</span><div class="metric">${money(m.net)}</div><span class="muted small">${comparison(m.net,previous?.net)}</span></div></div><div class="card"><div class="row between wrap"><div><h3>Spending by category</h3><p class="muted small">${m.name} · ${money(m.expenses)} total</p></div><span class="muted small">Compared with ${previous?.name || 'earlier month unavailable'}</span></div><div class="category-bars">${m.categories.map(([name,amount])=>{const prior=previous?.categories.find(([n])=>n===name)?.[1];return `<div class="category-line"><span>${name}</span><div class="category-track" aria-hidden="true"><div class="category-fill" style="width:${Math.round(amount/m.expenses*100)}%"></div></div><span class="right">${money(amount)}<br><span class="muted small">${prior==null?'—':`${amount>=prior?'+':'−'} ${money(amount-prior)}`}</span></span></div>`}).join('')}</div><div class="line"></div><p class="muted small">Example values. Transfers between your accounts are excluded. Select another month above to compare.</p></div><div class="row between"><span class="section">Transactions this month</span><button class="pill" data-view="transactions">Open transactions →</button></div>${monthIndex===2?rows():'<div class="card muted">Transaction examples are shown for November only.</div>'}</div>`};
const content={overview,month,transactions,rules,bank:()=>account('bank'),investment:()=>account('investment'),cash:()=>account('cash'),settings};
function render(){ $('#screen').className='screen';$('#screen').innerHTML=content[view]();document.querySelectorAll('.side [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===(view==='month'?'overview':view))); }
const forms={transaction:['New transaction','Add an expense, income, or transfer.',[['Type','Expense / Income / Transfer'],['Amount','0.00 €'],['Account','Everyday account'],['Category','Choose or enter a category'],['Description','Optional'],['Date','11/11/2026']]],snapshot:['Update investment value','Record the total value for this week.',[['Account','Investments'],['Total value','52,350.20 €'],['Week','09/11/2026'],['Deposits / withdrawals','Optional'],['Fees / dividends','Optional'],['Note','Optional']]],account:['Account details','Create or edit a bank, investment, or cash account.',[['Name','Everyday account'],['Type','Bank / Investment / Cash'],['Color','Blue'],['Opening balance','0.00 €']]],filters:['Filters','Narrow down your transactions.',[['Accounts','All accounts'],['Date range','All time'],['Type','All types'],['Category','All categories'],['Amount','Any amount']]],import:['Import bank statement','Choose a file, map its columns, and review rows before importing.',[['Account','Everyday account'],['File','CSV, TSV, OFX or ING text'],['Columns','Date · Description · Amount'],['Preview','12 valid · 2 duplicates · 1 needs attention']]],rule:['Categorization rule','Define when this rule should apply.',[['Description contains','e.g. Mercadona'],['Account','Any account'],['Amount','Optional'],['Category','Groceries']]],bulk:['Bulk actions','Choose transactions first, then apply an action.',[['Action','Set category / Move account / Mark reviewed / Delete']]],quality:['Data quality','Review items that may need attention.',[['Checks','Missing categories · Duplicates · Transfer pairs · Stale snapshots']]],backup:['Review backup','Compare the backup with local data before restoring.',[['Accounts','3 local → 3 backup'],['Transactions','124 local → 128 backup'],['Snapshots','26 local → 27 backup']]],backfill:['Investment flow backfill','Review inferred flows before applying changes.',[['Affected snapshots','4 snapshots across 1 account']]],delete:['Delete all data','This permanently removes all local accounts and history.',[['Confirmation','Type DELETE to confirm']]],cloud:['Cloud sync','Manage your connection and sync preferences.',[['Status','Connected · Last synced today']]],appearance:['Appearance','Choose a theme and language.',[['Theme','Dark / Light / System'],['Language','English / Español / System']]],about:['About Joyufy','Check the latest available version.',[['Version','1.4']]]};
function transactionDialog(){
 const accountNames={bank:'Everyday account',investment:'Investments',cash:'Cash'};
 const account=accountNames[view];
 const source=account?`<p class="muted small">Account · ${account}</p>`:`<label>Account<select id="transaction-account"><option>Everyday account</option><option>Cash</option><option>Investments</option></select></label>`;
 return `<div class="row between"><h2>New transaction</h2><button class="pill" data-close aria-label="Close">✕</button></div><p class="muted">Record an expense, income, or transfer.</p><div class="fields"><div><span class="muted small">Transaction type</span><div class="segmented" role="group" aria-label="Transaction type" style="margin-top:7px">${['Expense','Income','Transfer'].map(t=>`<button type="button" data-transaction-type="${t}" aria-pressed="${transactionType===t}">${t}</button>`).join('')}</div></div>${source}<label>Amount<input inputmode="decimal" placeholder="0.00 €"></label><label id="destination-field" class="${transactionType==='Transfer'?'':'hide'}">Destination account<select><option value="">Select destination</option><option>Investments</option><option>Cash</option><option>Everyday account</option></select></label><label id="category-field" class="${transactionType==='Transfer'?'hide':''}">Category<select id="transaction-category"><option value="">Select a category</option><option>Groceries</option><option>Home</option><option>Transport</option><option>Income</option><option value="other">Other…</option></select></label><label id="custom-category-field" class="hide">Custom category<input placeholder="Enter a category"></label><label>Description<input placeholder="Optional"></label><label>Date<input type="date" value="2026-11-11"></label></div><div class="footer">${button('Cancel','data-close')}${button('Add transaction','data-close','primary')}</div>`;
}
function openDialog(key){if(key==='transaction'){transactionType='Expense';$('#modal').innerHTML=transactionDialog();$('#overlay').classList.remove('hide');$('#modal button').focus();return}let [title,desc,fields]=forms[key];$('#modal').innerHTML=`<div class="row between"><h2>${title}</h2><button class="pill" data-close aria-label="Close">✕</button></div><p class="muted">${desc}</p><div class="fields">${fields.map(([l,v])=>`<label>${l}<input placeholder="${v}"></label>`).join('')}</div><div class="footer">${button('Cancel','data-close')}${button(key==='delete'?'Delete':key==='import'?'Review import':'Continue','data-close','primary')}</div>`;$('#overlay').classList.remove('hide');$('#modal input, #modal button').focus()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render()};if(b.dataset.month){monthIndex=Math.max(0,Math.min(monthlySamples.length-1,monthIndex+Number(b.dataset.month)));render()};if(b.dataset.transactionType){transactionType=b.dataset.transactionType;document.querySelectorAll('[data-transaction-type]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));$('#destination-field').classList.toggle('hide',transactionType!=='Transfer');$('#category-field').classList.toggle('hide',transactionType==='Transfer');$('#custom-category-field').classList.toggle('hide',transactionType==='Transfer'||$('#transaction-category').value!=='other')}if(b.dataset.dialog)openDialog(b.dataset.dialog);if(b.hasAttribute('data-close'))$('#overlay').classList.add('hide');if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.range){range=b.dataset.range;render()}if(b.dataset.mode){mode=b.dataset.mode;render()}});document.addEventListener('change',e=>{if(e.target.id==='transaction-category')$('#custom-category-field').classList.toggle('hide',e.target.value!=='other')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay').classList.add('hide')});render();
</script></body></html>
